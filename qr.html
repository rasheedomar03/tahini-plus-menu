<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tahini Plus — Table QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', system-ui, sans-serif;
    background: oklch(96% 0.006 82);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 2.5rem 2.25rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    box-shadow: 0 4px 24px oklch(20% 0.006 75 / 0.10), 0 1px 4px oklch(20% 0.006 75 / 0.06);
    max-width: 320px;
    width: 100%;
  }

  .brand {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.75rem;
    font-weight: 400;
    color: oklch(20% 0.01 75);
    letter-spacing: -0.01em;
    line-height: 1;
    text-align: center;
  }
  .brand em { font-style: italic; color: oklch(53% 0.108 37); }

  .tagline {
    font-size: 0.72rem;
    color: oklch(50% 0.01 75);
    letter-spacing: 0.04em;
    text-align: center;
    margin-top: 0.1rem;
  }

  .qr-wrap {
    background: oklch(98.5% 0.004 82);
    border-radius: 14px;
    padding: 1rem;
    border: 1px solid oklch(90% 0.008 82);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #qr-canvas img, #qr-canvas canvas { display: block; border-radius: 4px; }

  .cta {
    font-size: 0.875rem;
    font-weight: 500;
    color: oklch(30% 0.008 75);
    text-align: center;
  }

  .url {
    font-size: 0.65rem;
    color: oklch(60% 0.01 75);
    letter-spacing: 0.03em;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .url:hover { color: oklch(53% 0.108 37); }

  .divider {
    width: 40px;
    height: 2px;
    background: oklch(53% 0.108 37);
    border-radius: 2px;
    opacity: 0.4;
  }

  .halal {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: oklch(42% 0.08 145);
    background: oklch(94% 0.04 145);
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
  }

  @media print {
    body { background: #fff; padding: 0; justify-content: flex-start; padding-top: 1in; }
    .print-btn, .hint { display: none; }
    .card { box-shadow: none; border: 1px solid #ddd; margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="card">
  <div>
    <div class="brand">Tahini <em>Plus</em></div>
    <div class="tagline">Halal Kitchen &middot; Houston, TX</div>
  </div>

  <div class="divider"></div>

  <a href="https://rasheedomar03.github.io/tahini-plus-menu/menu.html" class="qr-wrap" style="text-decoration:none">
    <div id="qr-canvas"></div>
  </a>

  <div class="cta">Scan to view our full menu</div>
  <a class="url" href="https://rasheedomar03.github.io/tahini-plus-menu/menu.html" target="_blank" rel="noopener">rasheedomar03.github.io/tahini-plus-menu</a>
  <div class="halal">Halal Certified</div>
</div>

<script>
var MENU_URL = 'https://rasheedomar03.github.io/tahini-plus-menu/menu.html';

// Inline tiny QR code renderer — no external JS needed
// Uses the QR Server public API as an <img> with a canvas fallback
(function() {
  var wrap = document.getElementById('qr-canvas');

  // Option A: render via QR Server API (works if online)
  var img = document.createElement('img');
  img.width  = 200;
  img.height = 200;
  img.alt    = 'QR Code';
  img.style.borderRadius = '4px';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/'
    + '?size=200x200'
    + '&data=' + encodeURIComponent(MENU_URL)
    + '&color=281f1a'
    + '&bgcolor=ffffff'
    + '&margin=2';

  img.onerror = function() {
    // Option B: try goqr.me as backup
    var img2 = document.createElement('img');
    img2.width  = 200;
    img2.height = 200;
    img2.alt    = 'QR Code';
    img2.style.borderRadius = '4px';
    img2.src = 'https://quickchart.io/qr?text=' + encodeURIComponent(MENU_URL) + '&size=200';
    img2.onerror = function() {
      wrap.innerHTML = '<p style="font-size:.75rem;color:#888;text-align:center;width:200px">Could not load QR code.<br>Visit the URL below to use the menu.</p>';
    };
    wrap.innerHTML = '';
    wrap.appendChild(img2);
  };

  wrap.appendChild(img);
})();
</script>
</body>
</html>
